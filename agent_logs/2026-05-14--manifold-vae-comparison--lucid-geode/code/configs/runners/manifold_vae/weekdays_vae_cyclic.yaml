# @package _global_
# Priority sweep — the real fix: behavior-aligned flat VAE with a CYCLIC d_y for
# the isometry loss (period 7) plus a supervised-contrastive order loss. This
# forces the latent geometry to recover the weekday cyclic order. Run against the
# SAME --experiment-root as weekdays_current_spline.
defaults:
  - /base
  - /task: natural_domains_arithmetic_weekdays
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  loss_weights:
    w_recon: 1.0
    w_kl: 0.01
    w_behavior: 2.0
    w_isometry: 5.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
  behavior_geometry: cyclic
  behavior_period: 7
  contrastive_margin: 1.0
  patch_eval: false
  device: cpu
  arm_label: cyclic
