# @package _global_
# Priority sweep — Ablation 4b: behavior-pullback metric.
# Behavior-aligned VAE; geodesics follow the behavior-pullback metric
# G_y(z) = J_{F o f}^T g_y J_{F o f} (grounded in behavioral consequences).
# The paper-faithful metric. Reuses the shared-root spline cache.
defaults:
  - /base
  - /task: natural_domains_arithmetic_weekdays
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: metric_vae
  topology: unstructured
  metric: behavior_pullback
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  loss_weights:
    w_recon: 1.0
    w_kl: 0.1
    w_behavior: 1.0
    w_isometry: 1.0
    w_geodesic: 0.0
    w_patch: 0.0
  behavior_distance: hellinger
  patch_eval: false
  device: cpu
  arm_label: behavior_metric
