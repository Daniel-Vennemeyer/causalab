# @package _global_
# The steering fix: transition_centroid + a manifold-interpolation loss
# (w_manifold) that trains the DECODER so interpolated latent points decode to
# in-distribution activations. Directly attacks the confirmed steering
# bottleneck (off-distribution decoder interpolants → dist 1.32). Goal: drop
# patched distance-from-behavior-manifold toward the spline's 0.33 with the VAE's
# OWN decoded paths (not the project-to-data crutch). Discovered (transition) d_y;
# nothing injected.
defaults:
  - /base
  - /task: natural_domains_arithmetic_weekdays
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  behavior_geometry: precomputed
  transition_variable: number
  contrastive_margin: 1.0
  loss_weights:
    w_recon: 0.2
    w_kl: 0.01
    w_behavior: 0.0
    w_isometry: 2.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
    w_centroid_iso: 5.0
    w_compactness: 1.0
    w_manifold: 1.0       # NEW: keep decoded interpolants on the activation manifold
  patch_eval: true        # measure steering directly (the point of this arm)
  device: cpu
  arm_label: transition_manifold
