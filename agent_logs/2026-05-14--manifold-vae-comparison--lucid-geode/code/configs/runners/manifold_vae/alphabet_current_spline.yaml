# @package _global_
# Generalization (Phase 1): alphabet domain (NON-cyclic, a line E..Z, W=22).
# The key contrast to weekdays/months: topology is an interval, not a ring, so
# this tests whether discovery + the w_manifold steering win hold for a different
# topology. Mirrors weekdays_current_spline EXACTLY (layer 28, n_extra_pairs=29,
# default num_steps_along_path=50) for metric comparability. NOTE: with W=22 the
# VAE patches an even-stride sample of 21 of C(22,2)=231 centroid pairs.
defaults:
  - /base
  - /task: natural_domains_arithmetic_alphabet
  - /model: llama31_8b
  - /analysis/baseline
  - /analysis/subspace
  - /analysis/activation_manifold
  - /analysis/output_manifold
  - /analysis/path_steering
  - _self_

task:
  target_variable: result

subspace:
  layers: [28]

activation_manifold:
  layers: [28]
  # SEQUENTIAL-task fix (matches the paper): fit the ACTIVATION manifold on the
  # ordinal-index intrinsic coordinate (embeddings['result']), NOT the top-1 PCA
  # axis. PCA mode logs "No periodic pairs — using top 1 PCA components" for a
  # line, and the top-1 PCA axis scrambles letter order when the activation curve
  # folds -> our alphabet spline isometry collapsed to 0.058 and its geodesic lost
  # to linear (1.22 > 0.94), inverting the paper's letters result (iso 0.999,
  # geodesic 2.42 << linear 6.95). Parameter mode uses the ordinal coordinate the
  # paper uses for sequential tasks. (Cyclic weekdays/months keep PCA atan2, which
  # is already the paper's cyclic coordinate — no change there.)
  intrinsic_mode: parameter

# CRITICAL for non-cyclic domains: fit the BELIEF manifold from the task's DECLARED
# parametrization (causal_model.periods), NOT the PCA-geometry heuristic. The pca
# heuristic (detect_periodic_dims) FALSE-POSITIVES on alphabet — it wrapped the
# line E..Z into a circle (dim0=[0,2π]), making A≈Z and corrupting isometry (≈0)
# and distance (spline geometric 1.21 > linear 0.99, an impossible inversion).
# alphabet is cyclic=False -> no 'result' period declared -> parameter mode fits a
# correct NON-periodic line. (embeddings['result'] maps letters->index.)
output_manifold:
  intrinsic_mode: parameter

path_steering:
  n_extra_pairs: 29
  batch_size: 128
  isometry:
    n_interior_per_pair: 4
