# @package _global_
# Phase 2 spline baseline for the 2-D grid_5x5 ICLR graph_walk task. Mirrors the
# shipped grid_5x5_8b_pipeline (intrinsic_dim=2, parameter mode = ground-truth node
# coords, TPS activation + belief manifolds) and produces the baseline + subspace +
# belief-manifold caches the VAE/graph arm reuses. num_steps/n_prompts match the
# graph_walk convention (20 / 5) so the VAE patch is step-matched.
defaults:
  - /base
  - /task: graph_walk_grid_5x5
  - /model: llama31_8b
  - /analysis/baseline
  - /analysis/subspace
  - /analysis/activation_manifold
  - /analysis/output_manifold
  - /analysis/path_steering
  - _self_

task:
  target_variable: node_coordinates
  # Speed: baseline + subspace run the 8B over EVERY train example (2048-token walks),
  # so wall-clock scales with n_train. The pipeline only needs per-node centroids
  # (25 nodes), so 500 (~20/node) is ample and ~2x faster than the default 1000.
  n_train: 500

# ICLR prompts are ~2048-token random walks, so every 8B forward is long -> the
# default batch 32 OOMs the attention. Small batches for every step that runs the
# 8B (baseline generate + feature collection, subspace collection). path_steering
# batch is set via the BATCH env (run with BATCH=4).
baseline:
  batch_size: 4

subspace:
  layers: [28]
  token_positions: [last]   # graph_walk names its position 'last' (not 'last_token')
  batch_size: 4

activation_manifold:
  layers: [28]
  token_positions: [last]
  intrinsic_mode: parameter
  intrinsic_dim: 2
  batch_size: 8

output_manifold:
  intrinsic_mode: parameter
  intrinsic_dim: 2
  batch_size: 8

path_steering:
  batch_size: 8
  num_steps_along_path: 20
  n_prompts: 5
