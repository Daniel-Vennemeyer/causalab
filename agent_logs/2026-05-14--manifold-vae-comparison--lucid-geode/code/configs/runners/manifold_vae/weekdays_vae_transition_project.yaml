# @package _global_
# CONFIRMATION TEST: same discovered (transition) manifold + ordering as
# transition_centroid, but at patch time each decoded path point is snapped to
# the NEAREST REAL training activation before patching (patch_project_to_data).
# If distance-from-behavior-manifold drops from ~1.3 toward the spline's 0.33,
# it confirms the steering deficit is OFF-DISTRIBUTION decoder interpolants (not
# the latent ordering) — and motivates a manifold-faithful decoder (flow).
defaults:
  - /base
  - /task: natural_domains_arithmetic_weekdays
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  behavior_geometry: precomputed
  transition_variable: number
  contrastive_margin: 1.0
  loss_weights:
    w_recon: 0.2
    w_kl: 0.01
    w_behavior: 0.0
    w_isometry: 2.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
    w_centroid_iso: 5.0
    w_compactness: 1.0
  patch_eval: true
  patch_project_to_data: true   # snap decoded path points to nearest real activations
  device: cpu
  arm_label: transition_project
