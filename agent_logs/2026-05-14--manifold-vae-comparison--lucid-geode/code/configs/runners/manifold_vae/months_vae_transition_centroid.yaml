# @package _global_
# Generalization: months transition_centroid (discovered d_y, on-manifold OFF,
# latent-linear path). Baseline VAE steering arm vs the w_manifold arm. Same
# behavior-derived transition d_y (step `number`); NO topology injected.
defaults:
  - /base
  - /task: natural_domains_arithmetic_months
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  behavior_geometry: precomputed
  transition_variable: number
  contrastive_margin: 1.0
  loss_weights:
    w_recon: 0.2
    w_kl: 0.01
    w_behavior: 0.0
    w_isometry: 2.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
    w_centroid_iso: 5.0
    w_compactness: 1.0
  patch_eval: false
  device: cpu
  arm_label: transition_centroid
