# @package _global_
# The UNIVERSAL adaptive recipe: transition_manifold's loss block, but with the
# curvature loss (w_manifold) GATED by the discovered topology. The analysis
# classifies the (denoised) transition graph — cycle vs line vs 2-D — and keeps
# w_manifold on for non-convex manifolds (cycle/2-D) but drops it on a convex line.
# Same config runs on every domain; on months (cyclic) it should behave like
# transition_manifold (dist ~0.43); on a line it self-gates to transition_centroid.
defaults:
  - /base
  - /task: natural_domains_arithmetic_months
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  behavior_geometry: precomputed
  transition_variable: number
  transition_edge_min_frac: 0.34   # denoise spurious misclassification edges
  adapt_losses_to_topology: true   # gate w_manifold by discovered topology
  contrastive_margin: 1.0
  loss_weights:
    w_recon: 0.2
    w_kl: 0.01
    w_behavior: 0.0
    w_isometry: 2.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
    w_centroid_iso: 5.0
    w_compactness: 1.0
    w_manifold: 1.0       # kept on cyclic manifolds; auto-gated off on a line
  patch_eval: true
  device: cpu
  arm_label: transition_adaptive
