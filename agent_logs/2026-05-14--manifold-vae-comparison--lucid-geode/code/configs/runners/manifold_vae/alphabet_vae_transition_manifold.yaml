# @package _global_
# Generalization: alphabet transition_manifold = transition_centroid + w_manifold
# (on-manifold decoder). The weekdays steering win, tested on a NON-cyclic line
# (W=22) -> the strongest topology-generalization test of the w_manifold result.
defaults:
  - /base
  - /task: natural_domains_arithmetic_alphabet
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  behavior_geometry: precomputed
  transition_variable: number
  contrastive_margin: 1.0
  loss_weights:
    w_recon: 0.2
    w_kl: 0.01
    w_behavior: 0.0
    w_isometry: 2.0
    w_geodesic: 0.0
    w_patch: 0.0
    w_contrastive: 2.0
    w_centroid_iso: 5.0
    w_compactness: 1.0
    w_manifold: 1.0       # on-manifold decoder (the weekdays steering win)
  patch_eval: true
  device: cpu
  arm_label: transition_manifold
