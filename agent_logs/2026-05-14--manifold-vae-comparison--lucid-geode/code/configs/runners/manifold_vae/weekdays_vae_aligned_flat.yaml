# @package _global_
# Priority sweep — Ablation 3: behavior-aligned vs recon-only (flat VAE).
# Same architecture as the recon-only debug arm but with behavior + isometry
# losses on. Reuses the shared-root spline cache. Run against the SAME
# --experiment-root as weekdays_current_spline.
defaults:
  - /base
  - /task: natural_domains_arithmetic_weekdays
  - /model: llama31_8b
  - /analysis/behavior_manifold_vae
  - _self_

task:
  target_variable: result

behavior_manifold_vae:
  method: flat_vae
  topology: unstructured
  metric: latent_linear
  latent_dim: 2
  n_charts: 1
  layers: [28]
  token_positions: [last_token]
  loss_weights:
    w_recon: 1.0
    w_kl: 0.1
    w_behavior: 1.0
    w_isometry: 1.0
    w_geodesic: 0.0
    w_patch: 0.0
  behavior_distance: hellinger
  patch_eval: false
  device: cpu
  arm_label: aligned_flat
