# @package behavior_manifold_vae
_name_: behavior_manifold_vae
_subdir: ${.method}_topo-${.topology}_metric-${.metric}_charts${.n_charts}
_output_dir: ${experiment_root}/behavior_manifold_vae/${._subdir}
method: flat_vae            # flat_vae | metric_vae | atlas_vae | transport
# transport (method: transport): no VAE/decoder/parametric manifold. Learn a tangent
# field on activation space and steer by integrating it from real centroids. Uses the
# discovered 1-D order (transition graph); requires behavior_geometry=precomputed.
transport_neighbor_radius: 1   # connect example pairs within this many rank steps
transport_w_density: 0.0       # optional off-data penalty on the transport step (0=off)
transport_use_ground_truth_coord: false  # use the task's ordinal (paper coord) instead of the
                                          # discovered order — isolates the transport MECHANISM from
                                          # discovery noise (use where the discovered graph is not a
                                          # clean 1-D chain, e.g. alphabet's hubbed transition graph).
latent_dim: 2
topology: unstructured      # unstructured | s1 | interval | r2 | cylinder
n_charts: 1
metric: latent_linear       # latent_linear | decoder_pullback | behavior_pullback
loss_weights:
  w_recon: 1.0
  w_kl: 0.1
  w_behavior: 0.0
  w_isometry: 0.0
  w_geodesic: 0.0
  w_patch: 0.0
  w_contrastive: 0.0
  w_centroid_iso: 0.0   # match per-class latent-CENTROID distances to d_y (optimizes the eval metric directly)
  w_compactness: 0.0    # within-class scatter penalty (crisp centroids)
  w_manifold: 0.0       # off-manifold energy of decoded latent interpolants (keeps steering paths in-distribution)
behavior_distance: hellinger   # kl | hellinger | js
behavior_geometry: euclidean    # euclidean | cyclic | ordinal | activation | precomputed  (d_y for isometry; "activation" = label-free; "precomputed" = transition-derived (W,W) matrix built in the analysis from the model's behavioral transitions)
behavior_period: null           # null -> use n_classes (W); 7 for weekdays cyclic
contrastive_margin: 1.0
# Transition-derived d_y knobs (only used when behavior_geometry == precomputed):
# step this ordinal INPUT variable by +1 (others held fixed), read how the model's
# predicted result class moves, and use graph distance on the transition graph as
# d_y. NO topology/period/ordering of the RESULT is injected — only that
# `number` is an ordinal input we can step through.
transition_variable: number     # discrete ordinal input variable to step by +1
transition_hold_fixed: null     # null -> all OTHER input vars (e.g. entity); or an explicit list
transition_edge_min_frac: 0.0   # denoise the transition graph: drop edges rarer than this
                                # fraction of each endpoint's dominant transition (0 = keep
                                # all / backward-compatible; ~0.3 = modal transitions only).
adapt_losses_to_topology: false # if true, classify the discovered graph (cycle/line/2-D) and
                                # gate curvature losses (w_manifold/w_geodesic) OFF on a convex
                                # LINE — they help cyclic manifolds but hurt lines. Lets ONE
                                # recipe be optimal across topologies (data-derived, not injected).
train_on_centroids: false
arm_label: null         # unique per-arm tag for output dir + compare grouping (avoids collisions)
activation_site: single_final_token
patch_eval: false
patch_n_prompts: 16        # base prompts per pair for patched scoring
# MUST match the spline path_steering num_steps_along_path (50): the
# distance_from_behavior_manifold score SUMS along the path, so a different step
# count systematically rescales it and breaks comparability with the spline.
patch_num_steps: 50        # steps along each patched path
patch_max_pairs: 21        # class-centroid pairs only (weekdays: all C(7,2)=21).
                           # Spline path_steering also adds 29 dense "extra" pairs
                           # (50 total); the VAE patch scores the centroid subset.
patch_batch_size: 128      # forward batch size for collect_grid_distributions
patch_project_to_data: false  # confirmation test: snap each decoded path point to the
                              # nearest REAL training activation before patching (tests
                              # whether off-distribution decoder interpolants are why
                              # VAE steering ~ linear). Patches via the subspace featurizer.
subspace: null
layers: null
token_positions: [last_token]
hidden_dims: [256, 256]
behavior_hidden_dims: [128]
lr: 0.001
epochs: 200
batch_size: 128
kl_warmup_epochs: 20
n_arc_steps: 64
geodesic:
  n_points: 16
  n_iters: 100
  lr: 0.05
device: cpu
visualization:
  figure_format: pdf
